x-build-client-env: &build-client-env
  PLACEOS_BUILD_HOST: ${PLACEOS_BUILD_HOST:-build}
  PLACEOS_BUILD_PORT: ${PLACEOS_BUILD_PORT:-3000}

services:
  # Driver test harness
  drivers:
    # Pinned by digest (not the floating :latest tag) so the spec/report
    # classification behaviour the harness fail-closed hardening relies on
    # ("... spec failed", failures/timeouts counts, "Driver terminated with:" /
    # "driver process exited with:" lifecycle lines) can never drift under us
    # silently. This digest is the multi-arch index digest of
    # placeos/drivers-spec:latest resolved on 2026-09-01
    #   image created 2026-08-30, source rev 169fad4fa1bddd331ef8db51da0627c83d0addae,
    #   Crystal 1.21.0 (the marker strings themselves come from the placeos-driver
    #   shard, pinned separately in shard.lock -> 8.1.4).
    # Re-pin: `docker buildx imagetools inspect placeos/drivers-spec:latest`
    #   (or `docker manifest inspect`) -> copy the top-level index Digest, then
    #   update the sha256 below and this comment's date/rev.
    image: placeos/drivers-spec@sha256:7fffd9e3c21cb751223a087dcdf4109c752fcaf7ebcec0e6b6857ab280763f01
    restart: always
    container_name: placeos-drivers
    hostname: drivers
    depends_on:
      - build
      - redis
      - install-shards
    ports:
      - 127.0.0.1:8085:8080
      - 127.0.0.1:4444:4444
    volumes:
      - ${PWD}/.logs:/app/report_failures
      - ${PWD}/repositories:/app/repositories
      - ${PWD}:/app/repositories/local
    environment:
      <<: *build-client-env
      CI: ${CI:-}
      CRYSTAL_PATH: lib:/lib/local-shards:/usr/share/crystal/src
      REDIS_URL: redis://redis:6379
      TZ: $TZ
    cap_add:
      - "SYS_PTRACE"
    security_opt:
      - "seccomp:unconfined"

  build:
    image: placeos/build:${PLACE_BUILD_TAG:-nightly}
    restart: always
    hostname: build
    volumes:
      - ${PWD}/repositories:/app/repositories
      - ${PWD}:/app/repositories/local
      - ${PWD}/binaries:/app/bin/drivers
    environment:
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-placeos-drivers}
      AWS_KEY: ${AWS_KEY}
      AWS_SECRET: ${AWS_SECRET}
      GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
      PLACEOS_BUILD_LOCAL: 1
      PLACEOS_ENABLE_TRACE: 1
      # driver specs launch every driver against a mock raw TCP server, so all
      # transports need to be compiled into driver binaries built for testing
      PLACEOS_ALL_TRANSPORTS: 1
      TZ: $TZ
      BUILD_SERVICE_DISABLED: ${BUILD_SERVICE_DISABLED:-true}

  redis:
    image: eqalpha/keydb
    restart: always
    hostname: redis
    environment:
      TZ: $TZ

  # Ensures shards are installed.
  install-shards:
    image: placeos/crystal:${CRYSTAL_VERSION:-latest}
    restart: "no"
    working_dir: /wd
    entrypoint: ''
    command: sh -c 'shards check -q || shards install'
    environment:
      SHARDS_OPTS: "--ignore-crystal-version"
    volumes:
      - ${PWD}/shard.lock:/wd/shard.lock
      - ${PWD}/shard.yml:/wd/shard.yml
      - ${PWD}/shard.override.yml:/wd/shard.override.yml
      - ${PWD}/.shards:/wd/.shards
      - ${PWD}/lib:/wd/lib
